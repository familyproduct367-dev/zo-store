<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZO STORE V3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial}
body{background:#f8f9fa;color:#202124}
.hdr{padding:12px 16px;background:#fff;border-bottom:1px solid #e8eaed;display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:30}
.logo{width:40px;height:40px;background:#01875f;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:22px}
.hdr b{color:#01875f;font-size:22px}
.search{flex:1;background:#f1f3f4;border-radius:24px;padding:10px 16px;display:flex;gap:10px}
.search input{border:none;background:transparent;outline:none;width:100%;font-size:14px}
.nav{display:flex;gap:24px;padding:0 16px;background:#fff;border-bottom:1px solid #e8eaed;overflow:auto;position:sticky;top:64px;z-index:29}
.nav div{padding:14px 0;font-size:13px;font-weight:500;color:#5f6368;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.nav div.active{color:#01875f;border-color:#01875f}
.hero{padding:20px 16px;background:linear-gradient(135deg,#01875f,#00c896);color:#fff}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:#fff;border-radius:12px;padding:14px;border:1px solid #e8eaed;cursor:pointer}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.1)}
.icon{width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;margin-bottom:10px}
.card h3{font-size:13px;font-weight:500}
.card .dev{font-size:11px;color:#5f6368}
.meta{font-size:11px;color:#5f6368;margin-top:4px}
.meta b{color:#01875f;background:#e6f4ea;padding:2px 6px;border-radius:10px;font-size:10px}
/* DETAIL PAGE */
.detail{position:fixed;inset:0;background:#fff;z-index:100;overflow:auto;display:none}
.detail.active{display:block}
.detail-top{padding:12px 16px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff}
.back{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.back:hover{background:#f1f3f4}
.detail-head{padding:20px 16px;display:flex;gap:16px}
.detail-icon{width:72px;height:72px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff;flex-shrink:0}
.detail-info h1{font-size:22px;font-weight:500}
.detail-info .dev{color:#01875f;font-size:14px;margin:4px 0}
.detail-info .meta{font-size:12px}
.install-bar{padding:0 16px 16px;display:flex;gap:12px;align-items:center}
.btn-install{background:#01875f;color:#fff;border:none;padding:10px 24px;border-radius:20px;font-weight:500;font-size:14px;cursor:pointer;min-width:90px}
.btn-install.installed{background:#e8eaed;color:#5f6368}
.detail-body{padding:16px}
.screens{display:flex;gap:12px;overflow:auto;padding:10px 0}
.screen{width:180px;height:320px;background:#f1f3f4;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:48px}
.about{margin-top:20px;font-size:14px;line-height:1.6;color:#4d4d4d}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;display:none;z-index:200}
</style>
</head>
<body>
<div class="hdr"><div class="logo">Z</div><b>ZO Store</b><div class="search"><span>🔍</span><input id="s" placeholder="Search apps, Calculator, Gallery..."></div></div>
<div class="nav" id="nav"><div class="active" data-f="all">For you</div><div data-f="essential">Essential</div><div data-f="media">Media</div><div data-f="tools">Tools</div></div>
<div class="hero"><h2 style="font-weight:400">ZO STORE V3 • Global Platform</h2><p style="font-size:13px;opacity:.9;margin-top:4px">Tap any app to see details • Install dey work!</p></div>
<div class="wrap"><div class="grid" id="grid"></div></div>

<div class="detail" id="detail">
<div class="detail-top"><div class="back" id="back">←</div><div style="font-weight:500">App details</div></div>
<div class="detail-head"><div class="detail-icon" id="dIcon"></div><div class="detail-info"><h1 id="dName"></h1><div class="dev" id="dDev"></div><div class="meta" id="dMeta"></div></div></div>
<div class="install-bar"><button class="btn-install" id="installBtn">Install</button><div style="font-size:12px;color:#5f6368">Contains ads • In-app purchases</div></div>
<div class="detail-body"><div class="screens"><div class="screen" id="s1"></div><div class="screen" id="s2"></div><div class="screen" id="s3"></div></div><div class="about" id="dAbout"></div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const apps=[
{n:"Calculator",d:"ZO Labs",c:"tools",r:"4.8",col:"#4285f4",e:"🧮",desc:"Powerful calculator with scientific mode, history, and themes. No ads in calculation. Fast and offline."},
{n:"Gallery",d:"ZO Media",c:"media",r:"4.9",col:"#34a853",e:"🖼️",desc:"Beautiful gallery to organize photos, videos, hidden folder, and cloud backup. Fast scroll for 100k+ photos."},
{n:"Drive",d:"ZO Cloud",c:"essential",r:"4.7",col:"#fbbc04",e:"📁",desc:"Your files anywhere. 15GB free, secure, share with family. No GB issue, instant sync."},
{n:"Files",d:"ZO System",c:"essential",r:"4.8",col:"#0f9d58",e:"📂",desc:"Clean your phone, find files fast, share offline. No MB wahala."},
{n:"Camera",d:"ZO Media",c:"media",r:"4.8",col:"#ea4335",e:"📷",desc:"HD camera with night mode, portrait, and pro controls."},
{n:"Music",d:"ZO Audio",c:"media",r:"4.6",col:"#7c4dff",e:"🎵",desc:"Offline music player with equalizer and lyrics."},
{n:"Clock",d:"ZO Tools",c:"tools",r:"4.6",col:"#ff6d00",e:"⏰",desc:"Alarm, timer, stopwatch, world clock — simple."},
{n:"Calendar",d:"ZO Productivity",c:"tools",r:"4.7",col:"#4285f4",e:"📅",desc:"Plan events, reminders, sync with family."},
{n:"Recorder",d:"ZO Tools",c:"tools",r:"4.5",col:"#ff4081",e:"🎙️",desc:"Voice recorder with noise cancel."},
{n:"Notes",d:"ZO Labs",c:"essential",r:"4.9",col:"#ffab00",e:"📝",desc:"Take notes, checklist, sync."},
{n:"Weather",d:"ZO Labs",c:"essential",r:"4.6",col:"#03a9f4",e:"⛅",desc:"Accurate weather for Port Harcourt and world."},
{n:"Browser",d:"ZO Internet",c:"essential",r:"4.7",col:"#01875f",e:"🌐",desc:"Fast, private browser — No GB chopping."}
];
const grid=document.getElementById('grid');
const detail=document.getElementById('detail');
const toast=document.getElementById('toast');
let current=null;
function showToast(m){toast.textContent=m;toast.style.display='block';setTimeout(()=>toast.style.display='none',2000)}
function render(list){
grid.innerHTML='';
list.forEach((a,i)=>{
let el=document.createElement('div');el.className='card';
el.innerHTML=`<div class="icon" style="background:${a.col}">${a.e}</div><h3>${a.n}</h3><div class="dev">${a.d}</div><div class="meta">★ ${a.r} <b>Free</b></div>`;
el.onclick=()=>openDetail(i);
grid.appendChild(el);
});
}
function openDetail(i){
current=apps[i];
detail.classList.add('active');
document.getElementById('dIcon').style.background=current.col;
document.getElementById('dIcon').textContent=current.e;
document.getElementById('dName').textContent=current.n;
document.getElementById('dDev').textContent=current.d;
document.getElementById('dMeta').textContent=`★ ${current.r} • 10M+ downloads • Rated for 3+`;
document.getElementById('dAbout').textContent=current.desc;
document.getElementById('s1').textContent=current.e;
document.getElementById('s2').textContent='✨';
document.getElementById('s3').textContent='🚀';
document.getElementById('s1').style.background=current.col+'22';
document.getElementById('s2').style.background=current.col+'22';
document.getElementById('s3').style.background=current.col+'22';
document.getElementById('installBtn').textContent=localStorage.getItem('zo_'+current.n)?'Open':'Install';
document.getElementById('installBtn').className=localStorage.getItem('zo_'+current.n)?'btn-install installed':'btn-install';
window.scrollTo(0,0);
}
document.getElementById('back').onclick=()=>detail.classList.remove('active');
document.getElementById('installBtn').onclick=function(){
if(!current)return;
let key='zo_'+current.n;
if(localStorage.getItem(key)){showToast(current.n+' Opening... 🚀');return;}
this.textContent='Installing...';
setTimeout(()=>{
this.textContent='Open';
this.className='btn-install installed';
localStorage.setItem(key,'1');
showToast(current.n+' Installed! ✅');
},1200);
};
document.getElementById('s').addEventListener('input',e=>{
let q=e.target.value.toLowerCase();
render(apps.filter(a=>a.n.toLowerCase().includes(q)||a.d.toLowerCase().includes(q)));
});
document.getElementById('nav').querySelectorAll('div').forEach(t=>{
t.addEventListener('click',()=>{
document.querySelectorAll('.nav div').forEach(x=>x.classList.remove('active'));
t.classList.add('active');
let f=t.dataset.f;
if(f==='all')render(apps);else render(apps.filter(a=>a.c===f));
});
});
render(apps);
</script>
</body>
</html>
