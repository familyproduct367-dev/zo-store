<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZO STORE V2 - Global App Store</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Google Sans,Roboto,Arial,sans-serif}
body{background:#f8f9fa;color:#202124}
.hdr{padding:14px 20px;display:flex;align-items:center;gap:16px;background:#fff;border-bottom:1px solid #e8eaed;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:8px;font-size:22px}
.logo-icon{width:36px;height:36px;background:#01875f;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px}
.logo b{color:#01875f}
.search{flex:1;max-width:720px;background:#f1f3f4;border-radius:24px;padding:11px 18px;display:flex;gap:10px;align-items:center}
.search input{border:none;background:transparent;outline:none;width:100%;font-size:15px}
.search:focus-within{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.nav{display:flex;gap:28px;padding:0 20px;background:#fff;border-bottom:1px solid #e8eaed;overflow:auto;position:sticky;top:64px;z-index:19}
.nav div{padding:16px 0;font-size:14px;font-weight:500;color:#5f6368;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.nav div.active{color:#01875f;border-color:#01875f}
.hero{padding:28px 20px;background:linear-gradient(135deg,#01875f 0%,#00b386 100%);color:#fff}
.hero h1{font-size:32px;font-weight:400;margin-bottom:6px}
.hero p{font-size:15px;opacity:.9}
.wrap{max-width:1200px;margin:0 auto;padding:20px}
.sec{margin-bottom:32px}
.sec-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sec-top h2{font-size:20px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px}
.card{background:#fff;border-radius:12px;padding:16px;cursor:pointer;transition:.2s;border:1px solid #e8eaed}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.12);transform:translateY(-2px)}
.icon{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;margin-bottom:12px}
.card h3{font-size:14px;font-weight:500;line-height:1.3;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dev{font-size:12px;color:#5f6368;margin-bottom:6px}
.meta{font-size:12px;color:#5f6368;display:flex;gap:6px;align-items:center}
.meta b{font-size:11px;color:#01875f;background:#e6f4ea;padding:3px 7px;border-radius:12px}
.footer{text-align:center;padding:40px 20px;color:#5f6368;font-size:13px;border-top:1px solid #e8eaed;margin-top:20px;background:#fff}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:12px 24px;border-radius:24px;font-size:14px;display:none;z-index:100}
</style>
</head>
<body>
<div class="hdr">
<div class="logo"><div class="logo-icon">Z</div><div><b>ZO</b> Store</div></div>
<div class="search"><span>🔍</span><input id="searchInput" placeholder="Search Calculator, Drive, Gallery, Files..."></div>
</div>
<div class="nav" id="nav">
<div class="active" data-filter="all">For you</div>
<div data-filter="essential">Essential</div>
<div data-filter="media">Media</div>
<div data-filter="tools">Tools</div>
</div>
<div class="hero">
<h1>ZO STORE V2</h1>
<p>Calculator • Drive • Gallery • Files • Camera • Music • Clock • Calendar — No GB, No MB, Pure Global</p>
</div>
<div class="wrap">
<div class="sec"><div class="sec-top"><h2>All Apps - 8 Live</h2></div><div class="grid" id="grid"></div></div>
</div>
<div class="footer">ZO STORE V2 • Built by ZO Technology<br>familyproduct367-dev • V2 Working Global Platform</div>
<div class="toast" id="toast"></div>

<script>
const apps=[
{name:"Calculator",dev:"ZO Labs",cat:"tools",rate:"4.8",color:"#4285f4",emoji:"🧮",desc:"Fast calculator"},
{name:"Gallery",dev:"ZO Media",cat:"media",rate:"4.9",color:"#34a853",emoji:"🖼️",desc:"Photo & video gallery"},
{name:"Drive",dev:"ZO Cloud",cat:"essential",rate:"4.7",color:"#fbbc04",emoji:"📁",desc:"Cloud storage drive"},
{name:"Files",dev:"ZO System",cat:"essential",rate:"4.8",color:"#0f9d58",emoji:"📂",desc:"File manager"},
{name:"Camera",dev:"ZO Media",cat:"media",rate:"4.8",color:"#ea4335",emoji:"📷",desc:"HD camera"},
{name:"Music",dev:"ZO Audio",cat:"media",rate:"4.6",color:"#7c4dff",emoji:"🎵",desc:"Music player"},
{name:"Clock",dev:"ZO Tools",cat:"tools",rate:"4.6",color:"#ff6d00",emoji:"⏰",desc:"Alarm & clock"},
{name:"Calendar",dev:"ZO Productivity",cat:"tools",rate:"4.7",color:"#4285f4",emoji:"📅",desc:"Calendar & events"}
];

const grid=document.getElementById('grid');
const searchInput=document.getElementById('searchInput');
const nav=document.getElementById('nav');
const toast=document.getElementById('toast');

function showToast(msg){
toast.textContent=msg;
toast.style.display='block';
setTimeout(()=>toast.style.display='none',2500);
}

function render(list){
grid.innerHTML='';
list.forEach(app=>{
let d=document.createElement('div');
d.className='card';
d.innerHTML=`<div class="icon" style="background:${app.color}">${app.emoji}</div><h3>${app.name}</h3><div class="dev">${app.dev}</div><div class="meta">★ ${app.rate} <b>Free</b></div>`;
d.onclick=()=>showToast(app.name+' - Download coming in V3 🚀');
grid.appendChild(d);
});
}

render(apps);

// SEARCH WORKING
searchInput.addEventListener('input',(e)=>{
let q=e.target.value.toLowerCase();
let f=apps.filter(a=>a.name.toLowerCase().includes(q) || a.dev.toLowerCase().includes(q));
render(f);
});

// TABS WORKING
nav.querySelectorAll('div').forEach(tab=>{
tab.addEventListener('click',()=>{
nav.querySelectorAll('div').forEach(t=>t.classList.remove('active'));
tab.classList.add('active');
let filter=tab.dataset.filter;
if(filter==='all') render(apps);
else render(apps.filter(a=>a.cat===filter));
});
});
</script>
</body>
</html>
