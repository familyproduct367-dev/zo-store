<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZO STORE - Apps & Games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto, -apple-system, sans-serif}
body{background:#fff;color:#202124}
.h{padding:14px 20px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #e8eaed;position:sticky;top:0;background:#fff;z-index:10}
.logo{display:flex;align-items:center;gap:10px;font-weight:500;font-size:22px;color:#5f6368}
.logo b{color:#01875f;font-weight:700}
.logo-dot{width:32px;height:32px;background:#01875f;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:18px}
.srch{flex:1;max-width:700px;background:#f1f3f4;border-radius:24px;padding:10px 20px;display:flex;align-items:center;gap:12px}
.srch input{border:none;background:transparent;outline:none;flex:1;font-size:15px}
.nav{display:flex;gap:32px;padding:0 20px;border-bottom:1px solid #e8eaed;overflow:auto}
.nav div{padding:16px 0;font-size:14px;font-weight:500;color:#5f6368;white-space:nowrap;border-bottom:3px solid transparent;cursor:pointer}
.nav div.active{color:#01875f;border-color:#01875f}
.hero{padding:24px 20px}
.hero h1{font-size:28px;font-weight:400;margin-bottom:6px}
.hero p{font-size:14px;color:#5f6368}
.sec{padding:20px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sec-h h2{font-size:18px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.card{cursor:pointer}
.card-icon{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:24px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.card h3{font-size:14px;font-weight:400;line-height:1.3;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card p{font-size:12px;color:#5f6368;margin-bottom:4px}
.card span{font-size:12px;color:#5f6368}
.card b{font-size:11px;color:#01875f;background:#e6f4ea;padding:2px 6px;border-radius:4px;margin-left:4px}
.footer{text-align:center;padding:32px;color:#5f6368;font-size:12px;border-top:1px solid #e8eaed;margin-top:20px}
</style>
</head>
<body>

<div class="h">
  <div class="logo"><div class="logo-dot">Z</div><div><b>ZO</b> Store</div></div>
  <div class="srch"><span>🔍</span><input placeholder="Search for apps & games"></div>
</div>

<div class="nav">
  <div class="active">For you</div>
  <div>Top charts</div>
  <div>Games</div>
  <div>Apps</div>
  <div>Categories</div>
  <div>Editors choice</div>
</div>

<div class="hero">
  <h1>Discover apps for you</h1>
  <p>Recommended based on your interests • V1 Foundation</p>
</div>

<div class="sec">
  <div class="sec-h"><h2>Recommended for you</h2></div>
  <div class="grid" id="grid"></div>
</div>

<div class="footer">
  ZO STORE V1 • Global Software Distribution Platform<br>
  Discover. Download. Build. Connect.
</div>

<script>
const apps=[
{n:"Wallpaper 4K HD",dev:"ZO Studio",rate:"4.8",icon:"#01875f",L:"W"},
{n:"Music Player Pro",dev:"ZO Audio",rate:"4.7",icon:"#7c4dff",L:"M"},
{n:"File Manager",dev:"ZO Tools",rate:"4.6",icon:"#f59e0b",L:"F"},
{n:"Video Editor",dev:"ZO Creative",rate:"4.9",icon:"#ef4444",L:"V"},
{n:"Calculator+",dev:"ZO Labs",rate:"4.5",icon:"#06b6d4",L:"C"},
{n:"VPN Fast Secure",dev:"ZO Security",rate:"4.8",icon:"#10b981",L:"V"},
{n:"Photo Editor AI",dev:"ZO AI Lab",rate:"4.9",icon:"#8b5cf6",L:"P"},
{n:"Cloud Drive 100GB",dev:"ZO Cloud",rate:"4.7",icon:"#3b82f6",L:"D"}
];
const g=document.getElementById('grid');
apps.forEach(a=>{
  let d=document.createElement('div');
  d.className='card';
  d.innerHTML=`<div class="card-icon" style="background:${a.icon}">${a.L}</div><h3>${a.n}</h3><p>${a.dev}</p><span>★ ${a.rate} <b>Free</b></span>`;
  d.onclick=()=>alert(a.n+" - Download will be available in V14/V15 with external links & APK uploads");
  g.appendChild(d);
});
</script>
</body>
  </html>
