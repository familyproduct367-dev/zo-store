<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width"><title>TEST BUTTONS</title></head>
<body style="font-family:Arial;padding:20px;text-align:center">
<h2>ZO STORE BUTTON TEST</h2>
<input id="search" placeholder="Search..." style="padding:10px;width:90%;border-radius:20px;border:1px solid #ccc"><br><br>
<button onclick="alert('🔔 Bell works!')" style="padding:12px 20px;margin:5px">🔔 Bell</button>
<button onclick="alert('👤 User works!')" style="padding:12px 20px;margin:5px">👤 User</button>
<button onclick="alert('💼 Dev works!')" style="padding:12px 20px;margin:5px">💼 Dev</button>
<button onclick="alert('📤 Upload works!')" style="padding:12px 20px;margin:5px">📤 Upload</button>
<button onclick="alert('💳 Wallet works!')" style="padding:12px 20px;margin:5px">💳 Wallet</button>
<button onclick="alert('👑 Admin works!')" style="padding:12px 20px;margin:5px">👑 Admin</button>
<div style="margin-top:20px;padding:15px;background:#f0f0f0;border-radius:10px">
<div id="grid">If you see this, page loaded ✅</div>
</div>
<script>
document.getElementById('search').addEventListener('input',function(e){document.getElementById('grid').textContent='Searching: '+e.target.value+' ✅ Search works!' });
alert('Page loaded — Tap any button to test!');
</script>
</body>
</html>
