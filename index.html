<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZO STORE V2+V3</title>
<meta name="theme-color" content="#01875f">
<style>
:root{--green:#01875f;--bg:#f8f9fa;--card:#fff;--text:#202124;--sub:#5f6368;--border:#e8eaed;--blue:#1a73e8;--orange:#ff9800}
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial}
body{background:var(--bg);color:var(--text)}
.hdr{padding:10px 14px;background:var(--card);display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:30;border-bottom:1px solid var(--border)}
.logo{width:36px;height:36px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900}
.search{flex:1;background:var(--bg);border-radius:20px;padding:8px 12px;display:flex;gap:8px;border:1px solid var(--border)}
.search input{border:none;background:transparent;outline:none;width:100%;font-size:13px}
.nav{padding:8px 14px;display:flex;gap:8px;overflow:auto;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:53px;z-index:29}
.nav div{padding:7px 12px;font-size:12px;color:var(--sub);border-radius:16px;cursor:pointer;white-space:nowrap;border:1px solid var(--border)}
.nav div.active{background:var(--green);color:#fff;border-color:var(--green)}
.hero{margin:12px;background:linear-gradient(135deg,#01875f,#00bcd4);border-radius:12px;padding:14px;color:#fff;display:flex;justify-content:space-between;align-items:center}
.grid{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border-radius:12px;padding:10px;border:1px solid var(--border);cursor:pointer;position:relative}
.card-icon{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
.card h3{font-size:12px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-dev{font-size:10px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:10px;color:var(--sub);margin-top:4px;display:flex;gap:6px}
.badge{position:absolute;top:6px;right:6px;background:var(--green);color:#fff;font-size:7px;padding:2px 5px;border-radius:8px;font-weight:700}
.badge.ext{background:var(--orange)}
.cat-page{display:none;padding:12px}
.cat-page.active{display:block}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.cat-card{background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--border);cursor:pointer;text-align:center}
.cat-icon{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;margin:0 auto}
.cat-card h4{font-size:12px;margin-top:8px}
.cat-card span{font-size:10px;color:var(--green);font-weight:600;display:block;margin-top:4px}
.sub{font-size:8px;color:var(--sub);margin-top:4px}
.detail{position:fixed;inset:0;background:var(--card);z-index:100;overflow:auto;display:none}
.detail.active{display:block}
.detail-top{padding:10px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card)}
.dhead{padding:14px;display:flex;gap:12px}
.dicon{width:60px;height:60px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff}
.actions{padding:0 14px 14px;display:flex;gap:8px}
.btn{background:var(--green);color:#fff;border:none;padding:8px 16px;border-radius:16px;font-weight:600;cursor:pointer;font-size:12px}
.btn.sec{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn.ext{background:var(--orange);color:#000}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:16px;font-size:11px;display:none;z-index:400}
</style>
</head>
<body>
<div class="hdr"><div class="logo">Z</div><div class="search"><span>🔍</span><input id="search" placeholder="Search..."></div></div>
<div class="nav" id="nav">
<div class="active" data-f="all" onclick="showHome()">All</div>
<div data-f="cat" onclick="showCats()">Categories</div>
<div data-f="games" onclick="filterCat('games')">Games</div>
<div data-f="business" onclick="filterCat('business')">Business</div>
<div data-f="productivity" onclick="filterCat('productivity')">Productivity</div>
<div data-f="tools" onclick="filterCat('tools')">Tools</div>
</div>
<div id="homePage">
<div class="hero"><div><b>ZO STORE V2+V3</b><div style="font-size:11px;margin-top:2px">Professional + Categories</div></div><div style="font-size:28px">🚀</div></div>
<div style="padding:12px 14px 0;font-size:14px;font-weight:600">All Apps</div>
<div class="grid" id="grid"></div>
</div>
<div class="cat-page" id="catPage">
<div style="font-size:13px"><b onclick="showHome()" style="color:var(--green);cursor:pointer">← Home</b> / Categories</div>
<div class="cat-grid" id="catGrid"></div>
<div style="margin-top:16px;font-weight:600;font-size:14px" id="catTitle">Tap category</div>
<div class="grid" id="catApps"></div>
</div>
<div class="detail" id="detail">
<div class="detail-top"><div onclick="closeDetail()" style="cursor:pointer">← Back</div><div id="dTitle" style="font-weight:600;margin-left:10px"></div></div>
<div class="dhead"><div class="dicon" id="dIcon"></div><div><h2 id="dName" style="font-size:16px"></h2><div style="font-size:11px;color:var(--green)" id="dDev"></div><div style="font-size:10px;color:var(--sub);margin-top:4px" id="dMeta"></div></div></div>
<div class="actions"><button class="btn" id="installBtn">Download</button><button class="btn ext" id="externalBtn" style="display:none">Visit Link</button><button class="btn sec" onclick="closeDetail()">Close</button></div>
<div style="padding:14px"><div style="background:var(--bg);border-radius:10px;padding:10px;font-size:11px;line-height:1.5" id="dDesc"></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const APPS=[
{n:"ZO Calculator",d:"ZO Labs",c:"tools",sub:"tools",col:"#4285f4",e:"🧮",r:"4.9",badge:"APK",type:"apk",url:"#"},
{n:"Market Hub",d:"ZO Commerce",c:"business",sub:"market",col:"#ff9800",e:"🛒",r:"4.8",badge:"LINK",type:"link",url:"https://play.google.com/store"},
{n:"POS Business",d:"ZO Business",c:"business",sub:"pos",col:"#4caf50",e:"💳",r:"5.0",badge:"APK",type:"apk",url:"#"},
{n:"ZO AI",d:"ZO Intelligence",c:"productivity",sub:"ai",col:"#7c4dff",e:"🤖",r:"5.0",badge:"LINK",type:"link",url:"https://muse.ai"},
{n:"Video Call",d:"ZO Connect",c:"productivity",sub:"call",col:"#00bcd4",e:"📹",r:"4.9",badge:"APK",type:"apk",url:"#"},
{n:"Anambra Games",d:"Game Studio",c:"games",sub:"local",col:"#e91e63",e:"🎮",r:"4.7",badge:"APK",type:"apk",url:"#"},
{n:"QR Maker",d:"ZO Tools",c:"tools",sub:"qr",col:"#000",e:"🔳",r:"4.9",badge:"APK",type:"apk",url:"#"},
{n:"Igbo Translate",d:"ZO Labs",c:"tools",sub:"lang",col:"#3f51b5",e:"🌍",r:"5.0",badge:"APK",type:"apk",url:"#"},
{n:"Puzzle Game",d:"Game Studio",c:"games",sub:"puzzle",col:"#9c27b0",e:"🧩",r:"4.6",badge:"APK",type:"apk",url:"#"},
{n:"Finance Tracker",d:"Business Tools",c:"business",sub:"finance",col:"#009688",e:"📊",r:"4.9",badge:"APK",type:"apk",url:"#"}
];
const CATS=[
{id:"games",name:"Games",emoji:"🎮",col:"#e91e63",subs:["Action","Puzzle","Local"]},
{id:"business",name:"Business",emoji:"💼",col:"#ff9800",subs:["POS","Market","Finance"]},
{id:"productivity",name:"Productivity",emoji:"⚡",col:"#7c4dff",subs:["AI","Call","Community"]},
{id:"tools",name:"Tools",emoji:"🛠️",col:"#4285f4",subs:["QR","Language","Calculator"]}
];
let cur=null;
const grid=document.getElementById('grid'), catGrid=document.getElementById('catGrid'), catApps=document.getElementById('catApps'), detail=document.getElementById('detail'), toast=document.getElementById('toast');

function showToast(m){toast.textContent=m;toast.style.display='block';setTimeout(()=>toast.style.display='none',2000)}
function closeDetail(){detail.classList.remove('active')}
function showHome(){document.getElementById('homePage').style.display='block';document.getElementById('catPage').classList.remove('active');document.querySelectorAll('.nav div').forEach(x=>x.classList.remove('active'));document.querySelector('.nav div[data-f="all"]').classList.add('active');render(grid,APPS)}
function showCats(){document.getElementById('homePage').style.display='none';document.getElementById('catPage').classList.add('active');renderCats()}
function renderCats(){
catGrid.innerHTML='';
CATS.forEach(cat=>{
let count=APPS.filter(a=>a.c===cat.id).length;
let el=document.createElement('div');
el.className='cat-card';
el.innerHTML=`<div class="cat-icon" style="background:${cat.col}">${cat.emoji}</div><h4>${cat.name}</h4><span>${count} apps</span><div class="sub">${cat.subs.join(' • ')}</div>`;
el.onclick=()=>openCat(cat.id);
catGrid.appendChild(el);
});
document.getElementById('catTitle').textContent='Tap a category';
catApps.innerHTML='';
}
function openCat(id){
let cat=CATS.find(c=>c.id===id);
document.getElementById('catTitle').textContent=cat.name+' — '+APPS.filter(a=>a.c===id).length+' apps';
render(catApps, APPS.filter(a=>a.c===id));
}
function filterCat(c){
document.getElementById('homePage').style.display='block';
document.getElementById('catPage').classList.remove('active');
document.querySelectorAll('.nav div').forEach(x=>x.classList.remove('active'));
let t=document.querySelector(`.nav div[data-f="${c}"]`);
if(t) t.classList.add('active');
render(grid, c==='all'?APPS:APPS.filter(a=>a.c===c));
}
function render(container, list){
container.innerHTML='';
list.forEach((a)=>{
let idx=APPS.indexOf(a);
let el=document.createElement('div');
el.className='card';
el.innerHTML=`<div class="badge ${a.type==='link'?'ext':''}">${a.badge}</div><div class="card-icon" style="background:${a.col}">${a.e}</div><h3>${a.n}</h3><div class="card-dev">${a.d} • ${a.sub}</div><div class="card-meta"><span>★ ${a.r}</span><span>${a.c}</span></div>`;
el.onclick=()=>openApp(idx);
container.appendChild(el);
});
}
function openApp(i){
cur=APPS[i];
detail.classList.add('active');
document.getElementById('dIcon').style.background=cur.col;
document.getElementById('dIcon').textContent=cur.e;
document.getElementById('dName').textContent=cur.n;
document.getElementById('dTitle').textContent=cur.n;
document.getElementById('dDev').textContent=cur.d+' • '+cur.c+' / '+cur.sub;
document.getElementById('dMeta').textContent=`★ ${cur.r} • ${cur.type} • ${cur.c}`;
document.getElementById('dDesc').textContent=cur.n+' — '+cur.d+' — Category '+cur.c+' / '+cur.sub+' — Publishing: '+cur.type+' — '+(cur.type==='apk'?'APK upload Method A':'External link Method B: '+cur.url);
let apk=document.getElementById('installBtn');
let ext=document.getElementById('externalBtn');
if(cur.type==='apk'){apk.style.display='block';ext.style.display='none';apk.textContent='⬇️ Download APK';}
else{apk.style.display='none';ext.style.display='block';ext.textContent='🔗 Visit Link';}
}
document.getElementById('installBtn').onclick=()=>{showToast('⬇️ Downloading '+cur.n+' APK...');};
document.getElementById('externalBtn').onclick=()=>{if(confirm('Go to '+cur.url+'?')){window.open(cur.url,'_blank');showToast('🔗 Redirecting...');}};
document.getElementById('search').addEventListener('input',e=>{
let q=e.target.value.toLowerCase().trim();
if(!q){render(grid,APPS);return;}
let f=APPS.filter(a=>a.n.toLowerCase().includes(q)||a.c.toLowerCase().includes(q)||a.sub.toLowerCase().includes(q));
render(grid,f);
});
render(grid,APPS);
setTimeout(()=>showToast('V2+V3 LIVE — Ready for V4 fast!'),800);
</script>
</body>
</html>
